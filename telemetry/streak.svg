<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="250" viewBox="0 0 1280 250">
<title>Vigil: 54 days current, 54 days longest, 23,413 offerings in total</title>
<style>
  * { font-family: "Cormorant Garamond", "Palatino", "Georgia", serif; }
  .num { font-size: 56px; font-weight: 600; fill: #f3ecd8; }
  .big { font-size: 56px; font-weight: 600; fill: #e8c872; }
  .label { font-size: 21px; fill: #e8c872; letter-spacing: 5px; text-transform: uppercase; }
  .sub { font-size: 18px; font-style: italic; fill: #a99fc9; }
  .turn { transform-origin: 640px 92px; animation: turn 120s linear infinite; }
  .breath { animation: breath 6s ease-in-out infinite; }
  @keyframes turn { to { transform: rotate(360deg); } }
  @keyframes breath { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .turn, .breath { animation: none; } }
</style>
<defs>
  <radialGradient id="aura">
    <stop offset="0" stop-color="#8b6cf0" stop-opacity="0.45"/>
    <stop offset="1" stop-color="#8b6cf0" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#e8c872" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#e8c872" stop-opacity="0.7"/>
    <stop offset="1" stop-color="#e8c872" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect width="1280" height="250" rx="12" fill="#0a0618"/>
<rect width="1280" height="250" rx="12" fill="none" stroke="#3b2a8c" stroke-width="2"/>
<circle cx="60" cy="40" r="1.2" fill="#f3ecd8" opacity="0.6"/><circle cx="180" cy="210" r="1" fill="#f3ecd8" opacity="0.4"/><circle cx="330" cy="30" r="1.4" fill="#f3ecd8" opacity="0.7"/><circle cx="520" cy="220" r="1" fill="#f3ecd8" opacity="0.5"/><circle cx="760" cy="26" r="1.2" fill="#f3ecd8" opacity="0.5"/><circle cx="910" cy="214" r="1.4" fill="#f3ecd8" opacity="0.6"/><circle cx="1080" cy="48" r="1" fill="#f3ecd8" opacity="0.4"/><circle cx="1220" cy="200" r="1.2" fill="#f3ecd8" opacity="0.7"/><circle cx="1240" cy="30" r="1" fill="#f3ecd8" opacity="0.5"/><circle cx="450" cy="120" r="0.8" fill="#f3ecd8" opacity="0.3"/><circle cx="830" cy="130" r="0.8" fill="#f3ecd8" opacity="0.3"/><circle cx="40" cy="190" r="1" fill="#f3ecd8" opacity="0.4"/>

<g text-anchor="middle">
  <text x="213" y="60" class="sub">&#9790;</text>
  <text x="213" y="124" class="num">23,413</text>
  <text x="213" y="160" class="label">Offerings</text>
  <text x="213" y="190" class="sub">since Dec 27, 2011</text>
</g>

<g text-anchor="middle">
  <circle class="breath" cx="640" cy="92" r="100" fill="url(#aura)"/>
  <circle cx="640" cy="92" r="62" fill="none" stroke="#3b2a8c" stroke-width="2"/>
  <circle cx="640" cy="92" r="57" fill="none" stroke="#e8c872" stroke-opacity="0.5" stroke-width="1"/>
  <g class="turn"><line x1="708.0" y1="92.0" x2="722.0" y2="92.0" stroke="#e8c872" stroke-width="2" stroke-opacity="0.8"/><line x1="698.9" y1="126.0" x2="705.8" y2="130.0" stroke="#e8c872" stroke-width="1" stroke-opacity="0.8"/><line x1="674.0" y1="150.9" x2="678.0" y2="157.8" stroke="#e8c872" stroke-width="1" stroke-opacity="0.8"/><line x1="640.0" y1="160.0" x2="640.0" y2="174.0" stroke="#e8c872" stroke-width="2" stroke-opacity="0.8"/><line x1="606.0" y1="150.9" x2="602.0" y2="157.8" stroke="#e8c872" stroke-width="1" stroke-opacity="0.8"/><line x1="581.1" y1="126.0" x2="574.2" y2="130.0" stroke="#e8c872" stroke-width="1" stroke-opacity="0.8"/><line x1="572.0" y1="92.0" x2="558.0" y2="92.0" stroke="#e8c872" stroke-width="2" stroke-opacity="0.8"/><line x1="581.1" y1="58.0" x2="574.2" y2="54.0" stroke="#e8c872" stroke-width="1" stroke-opacity="0.8"/><line x1="606.0" y1="33.1" x2="602.0" y2="26.2" stroke="#e8c872" stroke-width="1" stroke-opacity="0.8"/><line x1="640.0" y1="24.0" x2="640.0" y2="10.0" stroke="#e8c872" stroke-width="2" stroke-opacity="0.8"/><line x1="674.0" y1="33.1" x2="678.0" y2="26.2" stroke="#e8c872" stroke-width="1" stroke-opacity="0.8"/><line x1="698.9" y1="58.0" x2="705.8" y2="54.0" stroke="#e8c872" stroke-width="1" stroke-opacity="0.8"/></g>
  <polygon points="640.0,40.0 685.0,118.0 595.0,118.0" fill="none" stroke="#8b6cf0" stroke-opacity="0.55" stroke-width="1.2"/><polygon points="640.0,144.0 595.0,66.0 685.0,66.0" fill="none" stroke="#8b6cf0" stroke-opacity="0.55" stroke-width="1.2"/>
  <text x="640" y="114" class="big">54</text>
  <text x="640" y="210" class="label">Current vigil</text>
  <text x="640" y="234" class="sub" style="font-size:16px">Oct 4 – Nov 26, 2026</text>
</g>

<g text-anchor="middle">
  <text x="1067" y="60" class="sub">&#10022;</text>
  <text x="1067" y="124" class="num">54</text>
  <text x="1067" y="160" class="label">Longest vigil</text>
  <text x="1067" y="190" class="sub">Oct 4 – Nov 26, 2026</text>
</g>

</svg>
