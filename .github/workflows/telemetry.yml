name: Telemetry

on:
  schedule:
    - cron: "0 3 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["telemetry/**"]

permissions:
  contents: write

jobs:
  streak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Render streak card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/streak.py "${{ github.repository_owner }}" telemetry/streak.svg
      - name: Commit the card
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A telemetry
          if git commit -m "Update streak card"; then
            git push
          fi
