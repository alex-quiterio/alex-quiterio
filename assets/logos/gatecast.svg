<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="t">
  <title id="t">Gatecast</title>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="#14141f"/>
  <!-- the gate wheel: 64 ticks, one per gate -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="url(#ring)" stroke-width="7"
          stroke-dasharray="2.3 2.998" transform="rotate(-90 64 64)"/>
  <circle cx="64" cy="64" r="46" fill="none" stroke="#2a2a3d" stroke-width="1"/>
  <!-- the spine joining the centers -->
  <rect x="63" y="24" width="2" height="86" fill="#3a3a52"/>
  <!-- the centers, top to bottom -->
  <polygon points="64,23 74,39 54,39" fill="#f2d675"/>
  <polygon points="54,42 74,42 64,56" fill="#4fb3a0"/>
  <rect x="57" y="59" width="14" height="10" rx="1.5" fill="#a0694f"/>
  <polygon points="64,72 73,81.5 64,91 55,81.5" fill="#f2d675"/>
  <rect x="57" y="94" width="14" height="9" rx="1.5" fill="#e0525a"/>
  <rect x="57" y="105" width="14" height="6" rx="1.5" fill="#a0694f"/>
</svg>
